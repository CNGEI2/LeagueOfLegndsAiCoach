services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lol_ai_coach}
      POSTGRES_USER: ${POSTGRES_USER:-lol_ai_coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lol_ai_coach}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+asyncpg://lol_ai_coach:lol_ai_coach@db:5432/lol_ai_coach}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    user: "10001:10001"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+asyncpg://lol_ai_coach:lol_ai_coach@db:5432/lol_ai_coach}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      RIOT_PLATFORM_DETECTION_ENABLED: ${RIOT_PLATFORM_DETECTION_ENABLED:-false}
      RIOT_PLATFORM_DETECTION_TTL_SECONDS: ${RIOT_PLATFORM_DETECTION_TTL_SECONDS:-86400}
      RIOT_PLATFORM_DETECTION_NOT_FOUND_TTL_SECONDS: ${RIOT_PLATFORM_DETECTION_NOT_FOUND_TTL_SECONDS:-300}
      RIOT_PLATFORM_CONFIRMATION_TTL_SECONDS: ${RIOT_PLATFORM_CONFIRMATION_TTL_SECONDS:-900}
      RIOT_ACCOUNT_PRIMARY_REGION: ${RIOT_ACCOUNT_PRIMARY_REGION:-AMERICAS}
      REPLAY_ENABLED: ${REPLAY_ENABLED:-false}
      REPLAY_STORAGE_BACKEND: ${REPLAY_STORAGE_BACKEND:-local}
      REPLAY_LOCAL_ROOT: /var/lib/lol-ai-coach/replays
      REPLAY_TOKEN_SECRET: ${REPLAY_TOKEN_SECRET:-}
      REPLAY_S3_ENDPOINT_URL: ${REPLAY_S3_ENDPOINT_URL:-}
      REPLAY_S3_REGION: ${REPLAY_S3_REGION:-}
      REPLAY_S3_BUCKET: ${REPLAY_S3_BUCKET:-}
      REPLAY_S3_ACCESS_KEY_ID: ${REPLAY_S3_ACCESS_KEY_ID:-}
      REPLAY_S3_SECRET_ACCESS_KEY: ${REPLAY_S3_SECRET_ACCESS_KEY:-}
      REPLAY_S3_PREFIX: ${REPLAY_S3_PREFIX:-replays}
      REPLAY_GATEWAY_RATE_LIMITS_ENFORCED: ${REPLAY_GATEWAY_RATE_LIMITS_ENFORCED:-false}
      INTERNAL_METRICS_TOKEN: ${INTERNAL_METRICS_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - replay_data:/var/lib/lol-ai-coach/replays
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10

  replay-worker:
    build: ./backend
    user: "10001:10001"
    read_only: true
    # A 4GiB source plus its normalized output can exceed memory-backed
    # tmpfs. `/tmp` is a Docker-managed disk volume (the image's 1777 /tmp
    # permissions are copied when it is initialized) so appuser can safely
    # hold the full ffmpeg working set without consuming container memory.
    # Give an in-flight ffmpeg job a real chance to finish before Docker
    # escalates SIGTERM to SIGKILL. The worker's SIGTERM handler stops
    # claiming new jobs but deliberately lets the current job run to
    # completion (see app/workers/replay.py::_consumer_loop); if a deployment
    # regularly needs longer than this, raise stop_grace_period alongside
    # REPLAY_PROCESS_TIMEOUT_SECONDS.
    stop_grace_period: 120s
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql+asyncpg://lol_ai_coach:lol_ai_coach@db:5432/lol_ai_coach}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      RIOT_API_KEY: ${RIOT_API_KEY:-}
      REPLAY_ENABLED: ${REPLAY_ENABLED:-false}
      REPLAY_STORAGE_BACKEND: ${REPLAY_STORAGE_BACKEND:-local}
      REPLAY_LOCAL_ROOT: /var/lib/lol-ai-coach/replays
      REPLAY_TOKEN_SECRET: ${REPLAY_TOKEN_SECRET:-}
      REPLAY_S3_ENDPOINT_URL: ${REPLAY_S3_ENDPOINT_URL:-}
      REPLAY_S3_REGION: ${REPLAY_S3_REGION:-}
      REPLAY_S3_BUCKET: ${REPLAY_S3_BUCKET:-}
      REPLAY_S3_ACCESS_KEY_ID: ${REPLAY_S3_ACCESS_KEY_ID:-}
      REPLAY_S3_SECRET_ACCESS_KEY: ${REPLAY_S3_SECRET_ACCESS_KEY:-}
      REPLAY_S3_PREFIX: ${REPLAY_S3_PREFIX:-replays}
      REPLAY_GATEWAY_RATE_LIMITS_ENFORCED: ${REPLAY_GATEWAY_RATE_LIMITS_ENFORCED:-false}
    command: ["python", "-m", "app.workers.replay"]
    volumes:
      - replay_data:/var/lib/lol-ai-coach/replays
      - replay_scratch:/tmp
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.replay", "--check"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  replay_data:
  replay_scratch:
